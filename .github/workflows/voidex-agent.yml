name: '⚔️ VoidEx Agent (Headless)'

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

defaults:
  run:
    shell: 'bash'

jobs:
  process-request:
    # Jalankan jika: Issue baru, ATAU komentar yang mengandung '@voidex369'
    if: |
      github.event_name == 'issues' || 
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@voidex369'))
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
      issues: 'write'
      pull-requests: 'write'
    
    steps:
      # 1. Checkout Code Repo
      - name: 'Checkout code'
        uses: 'actions/checkout@v4'

      # 2. Setup Node.js
      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install Dependencies
      - name: 'Install Dependencies'
        run: npm ci

      # 4. Build TypeScript
      - name: 'Build Project'
        run: npm run build

      # 5. Extract Context & Run Agent
      - name: 'Run VoidEx Agent'
        id: 'run_agent'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          # Logic: Jika event comment, ambil comment.body. Jika event issue baru, ambil issue.body.
          BODY: ${{ github.event.comment.body || github.event.issue.body }}
          REPO: ${{ github.repository }}
          # Model Xiaomi via OpenRouter
          MODEL: 'xiaomi/mimo-v2-flash:free'
        run: |
          # Script Node.js untuk menjalankan LocalExecutor tanpa UI (Pakai .cjs untuk CommonJS)
          cat <<'EOF' > run-voidex.cjs
          const path = require('path');
          
          // Kita gunakan import() dinamis untuk baca ESM module dari file .js
          // Ini cara paling aman tanpa conflict
          async function bootstrap() {
            const LocalExecutorPath = path.join(__dirname, 'dist', 'lib', 'agent', 'LocalExecutor.js');
            
            // Dynamic Import (Promise)
            const module = await import('file://' + LocalExecutorPath);
            const { LocalExecutor } = module;
            return LocalExecutor;
          }

          // Fungsi helper untuk kirim komentar ke GitHub
          // Menggunakan metode aman: Node.js handle JSON payload, lalu pass ke Curl via stdin
          async function postComment(token, repo, issueNumber, body) {
            const { spawn } = require('child_process');

            // Buat payload JSON yang valid
            const payload = JSON.stringify({ body: body });

            // Jalankan curl
            // -d @- artinya: baca data dari Stdin (standard input)
            const curl = spawn('curl', [
              '-s',
              '-H', `Authorization: token ${token}`,
              '-H', 'Accept: application/vnd.github.v3+json',
              '-X', 'POST',
              `https://api.github.com/repos/${repo}/issues/${issueNumber}/comments`,
              '-d', '@-'
            ]);

            // Kirim payload ke stdin curl
            curl.stdin.write(payload);
            curl.stdin.end();

            // Tangkap output
            let output = '';
            let errorOutput = '';

            curl.stdout.on('data', (data) => output += data);
            curl.stderr.on('data', (data) => errorOutput += data);

            return new Promise((resolve, reject) => {
              curl.on('close', (code) => {
                if (code === 0) {
                  console.log(`✅ Komentar terkirim ke Issue #${issueNumber}`);
                  resolve(true);
                } else {
                  console.error(`❌ Curl error (Code ${code}): ${errorOutput}`);
                  reject(new Error(errorOutput));
                }
              });
            });
          }

          // Main Runner dengan Dynamic Import
          (async () => {
            try {
              console.log("=== DEBUG INFO ===");
              console.log("ISSUE NUMBER:", process.env.ISSUE_NUMBER);
              console.log("RAW BODY:", process.env.BODY); // Lihat apa yang dibaca GitHub
              console.log("==================");

              console.log("Memuat LocalExecutor...");
              const LocalExecutor = await bootstrap();
              console.log("LocalExecutor loaded.");

              const apiKey = process.env.OPENROUTER_API_KEY;
              const model = process.env.MODEL;
              const repo = process.env.REPO;
              const issueNumber = process.env.ISSUE_NUMBER;
              const token = process.env.GITHUB_TOKEN;
              let requestBody = process.env.BODY;

              // Bersihkan trigger
              requestBody = requestBody.replace(/@voidex369/g, '').replace(/@voidex/g, '').replace(/@gemini-cli/g, '').trim();
              
              console.log("PROSESSED BODY:", requestBody); // Lihat hasil bersih

              if (!requestBody || requestBody.length < 3) {
                console.log("Body kosong atau terlalu singkat. Stopping.");
                return;
              }

              console.log(`🚀 Executing: Issue #${issueNumber} | Model: ${model}`);

              const executor = new LocalExecutor();
              let logs = [];
              let finalReport = "";

              await executor.run({
                model: model,
                apiKey: apiKey,
                messages: [{ role: 'user', content: `Analyze this request within the current project directory (File System): "${requestBody}".\n\nRules:\n1. If the request is "Cara pakai tool ini", it means "How to use tools available in this folder/project".\n2. List specific files or commands relevant to the request.\n3. Do not list your internal AI capabilities.` }],
                onUpdateMessages: (msgs) => {
                  const last = msgs[msgs.length - 1];
                  if (last && last.role === 'assistant' && last.content && last.content.length > 5) {
                    finalReport = last.content;
                  }
                },
                onStatusUpdate: (s) => s && console.log(`[STATUS] ${s}`),
                onLiveOutput: (out) => {
                  if (out && out.trim()) {
                    logs.push(out.trim());
                    process.stdout.write(`> ${out}\n`);
                  }
                },
                onNeedApproval: async () => 'always', // Auto approve di CI
                onToolWhitelisted: (n) => console.log(`[TOOL] ${n} allowed`),
                onError: (e) => {
                  console.error(`[ERR] ${e}`);
                  logs.push(`[ERROR] ${e}`);
                },
                allowedTools: ['run_shell_command', 'read_file', 'write_file', 'search_file_content', 'google_web_search', 'web_fetch', 'list_directory', 'glob', 'replace'],
                iterationLimit: 5
              });

              // Build Report (Simpel & Clean)
              let report = `**🤖 VoidEx Report**\n`;
              report += `> Request: "${requestBody}"\n`;
              report += `> Model: ${model}\n\n`;
              
              if (finalReport) {
                report += `**Analisis:**\n${finalReport}\n\n`;
              }
              
              if (logs.length > 0) {
                report += `**Log:**\n\`\`\`\n` + logs.join('\n').substring(0, 4000) + `\n\`\`\``;
              }

              await postComment(token, repo, issueNumber, report);

            } catch (err) {
              console.error("FATAL ERROR:", err);
            }
          })();
          EOF

          node run-voidex.cjs
